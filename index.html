<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Market Tracker</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: white;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .sub {
      color: #9da7b3;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 10px;
    }

    .start {
      background: #2ea043;
      color: white;
    }

    .stop {
      background: #da3633;
      color: white;
    }

    .add {
      background: #238636;
      color: white;
    }

    input,
    select {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #161b22;
      color: white;
      margin-right: 5px;
      margin-bottom: 10px;
    }

    .status {
      margin: 15px 0;
      padding: 12px;
      background: #161b22;
      border-radius: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 16px;
    }

    .symbol {
      font-size: 21px;
      font-weight: bold;
    }

    .type {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 12px;
    }

    .price {
      font-size: 25px;
      margin: 8px 0;
    }

    .signal {
      font-weight: bold;
      font-size: 18px;
    }

    .buy {
      color: #3fb950;
    }

    .sell {
      color: #f85149;
    }

    .wait,
    .hold {
      color: #d29922;
    }

    .error {
      color: #f85149;
      font-size: 12px;
      margin-top: 8px;
    }

    .remove {
      background: #30363d;
      color: white;
      margin-top: 10px;
    }

    .signals {
      margin-top: 25px;
    }

    .signal-row {
      padding: 10px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
    }
  </style>
</head>

<body>

  <h1>AI Market Tracker</h1>
  <div class="sub">Stocks + Crypto Live Alert Dashboard</div>

  <button class="start" onclick="startTracker()">Start Tracker</button>
  <button class="stop" onclick="stopTracker()">Stop Tracker</button>

  <div class="status" id="trackerStatus">
    Loading...
  </div>

  <h3>Add Stock or Crypto</h3>

  <input
    id="symbol"
    placeholder="Example: TSLA or DOGE-USD"
  />

  <select id="assetType">
    <option value="stock">Stock</option>
    <option value="crypto">Crypto</option>
  </select>

  <button class="add" onclick="addAsset()">Add</button>

  <h2>Markets</h2>

  <div id="markets" class="grid"></div>
<h2>📰 Market News</h2>
<div id="marketNews">
    Loading latest market news...
</div>

  <h2>🤖 AI Market View</h2>
<div id="aiMarketView">
    Waiting for AI market analysis...
</div>
  <div class="signals">
    <h2>Latest Signals</h2>
    <div id="signals"></div>
  </div>

  <script>
    async function startTracker() {
      await fetch("/api/start", {
        method: "POST"
      });

      loadStatus();
    }

    async function stopTracker() {
      await fetch("/api/stop", {
        method: "POST"
      });

      loadStatus();
    }

    async function addAsset() {
      const symbol = document
        .getElementById("symbol")
        .value
        .trim()
        .toUpperCase();

      const type = document
        .getElementById("assetType")
        .value;

      if (!symbol) {
        alert("Enter a symbol first.");
        return;
      }

      const response = await fetch("/api/add", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          symbol: symbol,
          type: type
        })
      });

      const result = await response.json();

      if (!result.ok) {
        alert(result.error || "Could not add asset.");
        return;
      }

      document.getElementById("symbol").value = "";

      loadStatus();
    }

    async function removeAsset(symbol) {
      await fetch("/api/remove", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          symbol: symbol
        })
      });

      loadStatus();
    }

    async function loadStatus() {
      try {
        const response = await fetch("/api/status");
        const data = await response.json();

        document.getElementById("trackerStatus").innerHTML =
          data.running
            ? "🟢 Tracker Running — " + data.mode
            : "🔴 Tracker Stopped — " + data.mode;

        const markets = document.getElementById("markets");

        markets.innerHTML = "";

        for (const [symbol, asset] of Object.entries(data.assets)) {

          let priceText = "Waiting for price...";

          if (asset.price && asset.price > 0) {
            priceText =
              "$" +
              Number(asset.price).toLocaleString(undefined, {
                minimumFractionDigits: 2,
                maximumFractionDigits: 6
              });
          }

          const signalClass =
            asset.signal.toLowerCase();

          markets.innerHTML += `
            <div class="card">

              <div class="symbol">
                ${symbol}
              </div>

              <div class="type">
                ${asset.type.toUpperCase()}
              </div>

              <div class="price">
                ${priceText}
              </div>

              <div class="signal ${signalClass}">
                ${asset.signal}
              </div>

              ${
                asset.error
                  ? `<div class="error">${asset.error}</div>`
                  : ""
              }

              <button
                class="remove"
                onclick="removeAsset('${symbol}')"
              >
                Remove
              </button>

            </div>
          `;
        }
const marketNews = document.getElementById("marketNews");

let allHeadlines = [];

for (const [symbol, asset] of Object.entries(data.assets)) {
    if (asset.headlines && asset.headlines.length) {
        asset.headlines.forEach(headline => {
            allHeadlines.push({
                symbol: symbol,
                headline: headline
            });
        });
    }
}

if (!allHeadlines.length) {
    marketNews.innerHTML = "No market news available yet.";
} else {
    marketNews.innerHTML = "";

    allHeadlines.slice(0, 10).forEach(item => {
        marketNews.innerHTML += `
            <div class="signal-row">
                <strong>${item.symbol}</strong><br>
                ${item.headline}
            </div>
        `;
    });
}
const aiMarketView = document.getElementById("aiMarketView");

let strongestAsset = null;

for (const [symbol, asset] of Object.entries(data.assets)) {
    const newsScore = Number(asset.news_score || 0);

    if (!strongestAsset || Math.abs(newsScore) > Math.abs(strongestAsset.score)) {
        strongestAsset = {
            symbol: symbol,
            score: newsScore,
            sentiment: asset.news_sentiment || "UNKNOWN",
            signal: asset.signal || "WAIT"
        };
    }
}

if (!strongestAsset) {
    aiMarketView.innerHTML = "Waiting for enough market data...";
} else {
    let outlook = "NEUTRAL";

    if (strongestAsset.score > 0.15) {
        outlook = "BULLISH";
    } else if (strongestAsset.score < -0.15) {
        outlook = "BEARISH";
    }

    aiMarketView.innerHTML = `
        <div class="signal-row">
            <strong>${strongestAsset.symbol}</strong><br>
            AI Outlook: ${outlook}<br>
            News Sentiment: ${strongestAsset.sentiment}<br>
            Current Signal: ${strongestAsset.signal}<br>
            Sentiment Score: ${strongestAsset.score.toFixed(2)}
        </div>
    `;
}
        
        const signals = document.getElementById("signals");

        if (!data.signals.length) {
          signals.innerHTML =
            '<div class="signal-row">No BUY or SELL signals yet.</div>';
        } else {

          signals.innerHTML = "";

          data.signals.forEach(item => {

            signals.innerHTML += `
              <div class="signal-row">

                ${item.time}
                —
                <strong>${item.symbol}</strong>
                —
                ${item.signal}
                @
                $${Number(item.price).toLocaleString()}

              </div>
            `;
          });
        }

      } catch (error) {

        document.getElementById("trackerStatus").innerHTML =
          "Unable to connect to tracker.";

      }
    }

    loadStatus();

    setInterval(loadStatus, 10000);
  </script>

</body>
</html>
