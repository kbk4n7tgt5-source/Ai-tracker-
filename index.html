<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>AI Market Tracker</title>
  <style>
    :root{color-scheme:dark;--bg:#0c1016;--panel:#151b23;--line:#303844;--text:#f5f7fa;--muted:#98a2b3;--green:#2dd881;--red:#ff6262;--gold:#e3a928}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(960px,100%);margin:auto;padding:22px 16px 60px}h1{font-size:30px;margin:8px 0 18px}h2{margin:32px 0 14px;font-size:25px}h3{margin:0 0 8px}
    .toolbar,.add-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.status{margin:14px 0;color:var(--muted)}
    button,input,select{min-height:46px;border:1px solid var(--line);border-radius:12px;font-size:16px}button{padding:0 18px;color:#fff;background:#303844;font-weight:700}button.primary{background:var(--green);color:#07140d;border:0}button.danger{background:#4a2528}input,select{padding:0 13px;background:var(--panel);color:#fff}input{flex:1;min-width:190px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card,.box,.news-item{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.price{font-size:30px;margin:12px 0}.type,.meta{color:var(--muted);font-size:14px}.signal{font-size:20px;font-weight:800;margin:8px 0 16px}.BUY,.BULLISH,.POSITIVE{color:var(--green)}.SELL,.BEARISH,.NEGATIVE{color:var(--red)}.WAIT,.NEUTRAL,.UNKNOWN{color:var(--gold)}
    .news-list{display:grid;gap:12px}.news-item a{color:var(--text);font-weight:750;text-decoration:none}.news-item p{color:#cbd2dc;margin:8px 0}.empty{color:var(--muted);padding:14px 0}.error{color:#ff9b9b}.ai-row{padding:14px 0;border-bottom:1px solid var(--line)}.ai-row:last-child{border:0}.signal-row{padding:12px 0;border-bottom:1px solid var(--line)}
  </style>
</head>
<body>
<main>
  <h1>&#128200; AI Market Tracker</h1>
  <div class="toolbar"><button class="primary" onclick="startTracker()">Start Tracker</button><button class="danger" onclick="stopTracker()">Stop Tracker</button></div>
  <div id="trackerStatus" class="status">Connecting...</div>
  <h2>Add Stock or Crypto</h2>
  <div class="add-row"><input id="symbol" placeholder="Example: TSLA or DOGE-USD" autocomplete="off"><select id="assetType"><option value="stock">Stock</option><option value="crypto">Crypto</option></select><button onclick="addAsset()">Add</button></div>
  <h2>Markets</h2><div id="markets" class="grid"><div class="empty">Loading markets...</div></div>
  <h2>&#128240; Market News</h2><div id="marketNews" class="news-list"><div class="empty">Loading latest market news...</div></div>
  <h2>&#129302; AI Market View</h2><div id="aiMarketView" class="box"><div class="empty">Waiting for analysis...</div></div>
  <h2>Latest Signals</h2><div id="signals" class="box"><div class="empty">No BUY or SELL signals yet.</div></div>
</main>
<script>
  let lastNews=[];
  try{lastNews=JSON.parse(localStorage.getItem("lastMarketNews")||"[]")}catch(_){}
  const el=id=>document.getElementById(id);
  const esc=value=>String(value??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
  const cls=value=>esc(String(value||"UNKNOWN").toUpperCase().replace(/[^A-Z]/g,""));
  async function request(url,options={}){const response=await fetch(url,options);const text=await response.text();let data={};try{data=text?JSON.parse(text):{}}catch(_){}if(!response.ok)throw new Error(data.error||data.message||`Request failed (${response.status})`);return data}
  async function startTracker(){await action("/api/start",{method:"POST"})}
  async function stopTracker(){await action("/api/stop",{method:"POST"})}
  async function action(url,options){try{await request(url,options);await loadStatus()}catch(e){el("trackerStatus").innerHTML=`<span class="error">${esc(e.message)}</span>`}}
  async function addAsset(){const symbol=el("symbol").value.trim().toUpperCase(),type=el("assetType").value;if(!symbol){alert("Enter a symbol first.");return}await action("/api/add",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({symbol,type})});el("symbol").value=""}
  async function removeAsset(symbol){await action("/api/remove",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({symbol})})}
  function renderMarkets(data){let assets=data.assets||data.markets||[];if(!Array.isArray(assets)&&assets&&typeof assets==="object")assets=Object.entries(assets).map(([symbol,v])=>({symbol,...(v||{})}));if(!assets.length){el("markets").innerHTML='<div class="empty">No markets added yet.</div>';return}el("markets").innerHTML=assets.map(a=>{const symbol=a.symbol||a.ticker||"Unknown",signal=String(a.signal||"WAIT").toUpperCase(),price=Number(a.price??a.last_price);return `<article class="card"><h3>${esc(symbol)}</h3><div class="type">${esc(String(a.type||a.asset_type||"asset").toUpperCase())}</div><div class="price">${Number.isFinite(price)?"$"+price.toLocaleString(undefined,{maximumFractionDigits:8}):"Price unavailable"}</div><div class="signal ${cls(signal)}">${esc(signal)}</div>${a.error?`<div class="error">${esc(a.error)}</div>`:""}<button onclick='removeAsset(${JSON.stringify(String(symbol))})'>Remove</button></article>`}).join("")}
  function renderNews(data){const incoming=data.news||data.market_news||[];if(Array.isArray(incoming)&&incoming.length){lastNews=incoming;try{localStorage.setItem("lastMarketNews",JSON.stringify(lastNews))}catch(_){}}if(!lastNews.length){el("marketNews").innerHTML='<div class="empty">No market news available yet.</div>';return}el("marketNews").innerHTML=lastNews.map(n=>{if(typeof n==="string")return `<article class="news-item">${esc(n)}</article>`;const title=n.title||n.headline||"Market update",url=n.url||n.link||"",summary=n.summary||n.description||"",source=n.source||n.publisher||"";const heading=url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(title)}</a>`:`<strong>${esc(title)}</strong>`;return `<article class="news-item">${heading}${summary?`<p>${esc(summary)}</p>`:""}${source?`<div class="meta">${esc(source)}</div>`:""}</article>`}).join("")}
  function renderAI(data){let views=data.ai_market_view||data.ai_view||data.analysis||[];if(!Array.isArray(views)&&views&&typeof views==="object")views=Object.entries(views).map(([symbol,v])=>({symbol,...(v||{})}));if(!views.length){el("aiMarketView").innerHTML='<div class="empty">Waiting for AI market analysis...</div>';return}el("aiMarketView").innerHTML=views.map(v=>{const outlook=String(v.outlook||v.ai_outlook||"NEUTRAL").toUpperCase(),sentiment=String(v.news_sentiment||v.sentiment||"UNKNOWN").toUpperCase();return `<div class="ai-row"><h3>${esc(v.symbol||v.ticker||"Market")}</h3><div>AI Outlook: <span class="${cls(outlook)}">${esc(outlook)}</span></div><div>News Sentiment: <span class="${cls(sentiment)}">${esc(sentiment)}</span></div><div>Current Signal: ${esc(v.signal||v.current_signal||"WAIT")}</div><div>Sentiment Score: ${esc(v.sentiment_score??v.score??"0.00")}</div></div>`}).join("")}
  function renderSignals(data){const signals=Array.isArray(data.signals)?data.signals:[];el("signals").innerHTML=signals.length?signals.slice().reverse().slice(0,20).map(s=>`<div class="signal-row">${typeof s==="string"?esc(s):`<strong>${esc(s.symbol||"")}</strong> &mdash; <span class="${cls(s.signal||s.action)}">${esc(s.signal||s.action||"WAIT")}</span> ${esc(s.time||s.timestamp||"")}`}</div>`).join(""):'<div class="empty">No BUY or SELL signals yet.</div>'}
  async function loadStatus(){try{const data=await request("/api/status",{cache:"no-store"});el("trackerStatus").textContent=data.running?"Tracker is running":"Tracker is stopped";renderMarkets(data);renderNews(data);renderAI(data);renderSignals(data)}catch(e){el("trackerStatus").innerHTML=`<span class="error">Connection error: ${esc(e.message)}</span>`;renderNews({})}}
  loadStatus();setInterval(loadStatus,10000);
</script>
</body>
</html>
